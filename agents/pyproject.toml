[tool.poetry]
name = "Jobs-intel"
version = "1.0.0"
description = "CodeWizard Jobs Intelligence Engine (LangGraph)"
authors = ["CodeWizard"]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
langgraph = "^0.2.60"
langchain = "^0.3.9"
langchain-core = "^0.3.21"
langchain-openai = "^0.2.10"
pydantic = "^2.10.2"
pydantic-settings = "^2.6.1"
httpx = "^0.27.2"
supabase = "^2.10.0"
python-dotenv = "^1.0.1"
tenacity = "^9.0.0"
structlog = "^24.4.0"
rapidfuzz = "^3.10.1"
beautifulsoup4 = "^4.12.3"
feedparser = "^6.0.11"
diskcache = "^5.6.3"
tiktoken = "^0.8.0"
numpy = "^2.1.3"
pgvector = "^0.3.6"
uvicorn = "^0.32.0"
fastapi = "^0.115.5"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.1"
pytest = "^8.3.3"
black = "^24.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
